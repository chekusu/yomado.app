name: Build and deploy

on:
  push:
    # main is production; preview/* branches deploy to their own Pages preview URL.
    branches: [main, 'preview/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run verify

      - name: Install Chromium for the smoke test
        run: |
          if [ "${ACT:-}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - run: npm test

      - name: Keep the built site for the deploy job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 1

  # Deploys run on the sandbank-tyo runner reserved for public repositories. It can read
  # only this site's Cloudflare token from the key store; the repository has no GitHub secrets.
  # Pull requests never reach it: the job runs only for pushes, and workflows from outside
  # contributors need approval before they run at all.
  # A push to main updates the production site; a push to preview/<name> only publishes a
  # preview deployment at <branch alias>.<project>.pages.dev and leaves production alone.
  deploy:
    needs: site
    if: github.event_name == 'push'
    runs-on: [self-hosted, tyo-deploy-public]
    steps:
      # The checkout supplies the Pages functions; the site itself comes from the build job.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Load deploy keys
        run: vas-ci-env deploy.yomado.app

      - name: Deploy to Cloudflare Pages
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$DEPLOY_BRANCH" ]; then
            echo "No branch name for this push; refusing to guess where to deploy."
            exit 1
          fi
          echo "Deploying branch $DEPLOY_BRANCH"
          npx --yes wrangler@4.92.0 pages deploy dist \
            --project-name yomado-dev \
            --branch "$DEPLOY_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=true
