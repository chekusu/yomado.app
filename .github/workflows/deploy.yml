name: Build and deploy

on:
  push:
    # main is production; preview/* branches deploy to their own Pages preview URL.
    branches: [main, 'preview/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  site:
    runs-on: hayabuild-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run verify

      - name: Install Chromium for the smoke test
        run: |
          # act and self-hosted runners (Hayabuild Linux) have no sudo for apt-get; the libraries Chromium needs
          # are already installed there.
          if [ "${ACT:-}" = "true" ] || [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - run: npm test

  # Deploys run on the sandbank-tyo runner reserved for public repositories. It can read
  # only this site's Cloudflare token from the key store; the repository has no GitHub secrets.
  # Pull requests never reach it: the job runs only for pushes, and workflows from outside
  # contributors need approval before they run at all.
  # It builds the site itself from the same commit, after the site job's checks passed, so no
  # artifact goes through GitHub's Actions storage. The build runs before the deploy keys load.
  # A push to main updates the production site; a push to preview/<name> only publishes a
  # preview deployment at <branch alias>.<project>.pages.dev and leaves production alone.
  deploy:
    needs: site
    if: github.event_name == 'push'
    runs-on: [self-hosted, tyo-deploy-public]
    steps:
      # The checkout supplies the Pages functions and the site's source.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build
      - run: npm run verify

      - name: Load deploy keys
        run: vas-ci-env deploy.yomado.app

      - name: Deploy to Cloudflare Pages
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$DEPLOY_BRANCH" ]; then
            echo "No branch name for this push; refusing to guess where to deploy."
            exit 1
          fi
          echo "Deploying branch $DEPLOY_BRANCH"
          npx --yes wrangler@4.92.0 pages deploy dist \
            --project-name yomado-dev \
            --branch "$DEPLOY_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=true

      # Tell Bing and the other IndexNow search engines, whose index also feeds the web search of
      # AI assistants, that the production pages changed. Production only, and never a failed deploy.
      - name: Notify search engines (IndexNow)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/indexnow.mjs dist
